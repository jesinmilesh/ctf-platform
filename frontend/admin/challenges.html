<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISSIONS OVERWATCH // XPLOITX C2</title>
  <meta name="description" content="Mission catalog management for administrators.">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>

  <header class="tactical-navbar admin-header">
    <div class="container navbar-inner">
      <div style="display:flex; align-items:center; gap:16px;">
        <span style="font-family:var(--font-display); font-size:16px; font-weight:900; color:#fff; letter-spacing:0.1em;">
          XPLOITX // <span style="color:var(--danger);">C2 COMMAND ROOM</span>
        </span>
      </div>
      <a href="/dashboard.html" class="btn btn-sm btn-outline" style="text-decoration:none;">PUBLIC PORTAL</a>
    </div>
  </header>

  <div class="container" style="padding: 24px 20px;">
    <div class="admin-layout-body">
      <div id="admin-sidebar-container"></div>

      <main>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;">
          <div>
            <span style="font-family:var(--font-mono); font-size:11px; color:var(--danger); font-weight:700; letter-spacing:0.1em;">
              MISSION REGISTRY // C2 INVENTORY
            </span>
            <h1 style="font-family:var(--font-heading); font-size:26px; font-weight:800; color:#fff; margin:2px 0 0 0;">
              All Target Challenges
            </h1>
          </div>
          <a href="/admin/challenge-editor.html" class="btn btn-primary" style="text-decoration:none;">
            + NEW MISSION STUDIO
          </a>
        </div>

        <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;">
          <table style="width:100%; border-collapse:collapse; text-align:left;">
            <thead>
              <tr style="background:var(--bg-secondary); border-bottom:1px solid var(--border); font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); text-transform:uppercase;">
                <th style="padding:12px 16px;">Mission ID</th>
                <th style="padding:12px 16px;">Title</th>
                <th style="padding:12px 16px;">Category</th>
                <th style="padding:12px 16px;">Difficulty</th>
                <th style="padding:12px 16px;">Points</th>
                <th style="padding:12px 16px;">Solves</th>
                <th style="padding:12px 16px;">Actions</th>
              </tr>
            </thead>
            <tbody id="adminChallengesTableBody">
              <tr>
                <td colspan="7" style="text-align:center; padding:30px; color:var(--text-secondary); font-family:var(--font-mono);">
                  CONNECTING TO MISSION REGISTRY...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/sidebar.js"></script>
  <script src="/assets/js/admin/challenges.js"></script>
</body>
</html>
