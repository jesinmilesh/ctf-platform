<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISSIONS // XPLOITX CYBER BATTLEFIELD</title>
  
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/public.css">
</head>
<body>
  
  <!-- Original Dynamic Header -->
  <div id="navbar-container"></div>

  <main class="container" style="padding: 40px 20px;">
    
    <!-- New Event Track Layout Inside Main (Native CSS) -->
    <div class="event-track-container">
      
      <!-- Event Track Graph -->
      <div style="width: 100%;">
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 12px;">
          <div>
            <h2 class="event-track-header" style="margin-bottom:4px;">Operational Sectors // Event Tracks</h2>
            <p style="color:var(--text-secondary); font-size:12px; font-family:var(--font-mono); margin:0;">
              Select a tactical sector to isolate target missions or engage all operational vectors.
            </p>
          </div>
          <button type="button" id="resetTrackBtn" class="btn btn-sm btn-outline" style="font-size:11px; padding:6px 12px; display:none;" onclick="window.selectTrack && window.selectTrack('all')">
            VIEW ALL TRACKS
          </button>
        </div>
        
        <div class="event-track-timeline" id="eventTrackTimeline">
          <!-- Connecting Line -->
          <div class="event-track-line"></div>
          <!-- Track Nodes dynamically injected by challenges.js -->
        </div>
      </div>

      <div style="width: 100%; height: 1px; background: var(--border); margin: 8px 0;"></div>

      <!-- Selected Track Details Area -->
      <div style="display: flex; flex-direction: column; gap: 24px;">
        <!-- Banner -->
        <div class="track-details-banner">
          <div class="track-details-left">
            <h2 id="trackTitle">All Operations</h2>
            <p id="trackDescription">Complete available mission objectives across active sectors.</p>
          </div>
          
          <div class="track-details-stats">
            <div class="track-stat-block">
              <span class="track-stat-label" style="color: var(--accent);">Missions Solved</span>
              <span class="track-stat-value" id="trackSolvedStat">0 / 0</span>
            </div>
            <div class="track-stat-divider"></div>
            <div class="track-stat-block">
              <span class="track-stat-label" style="color: var(--cyan);">Available XP</span>
              <span class="track-stat-value" id="trackPointsStat" style="color: var(--cyan);">0 XP</span>
            </div>
          </div>
        </div>

        <!-- Toolbar with Search & Category/Difficulty Filters -->
        <div class="track-toolbar" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
          <input 
            type="search" 
            id="challengeSearch"
            class="track-search-input" 
            placeholder="Search challenges by name, mission ID, or category..."
            style="flex:1; min-width:240px;"
          >
          <select id="categoryFilter" style="background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:10px 14px; border-radius:var(--radius-sm); font-family:var(--font-heading); font-size:13px; cursor:pointer;">
            <option value="">All Categories</option>
            <option value="PWN">PWN</option>
            <option value="Misc">Misc</option>
            <option value="Web">Web</option>
            <option value="Network">Network</option>
            <option value="Digital Forensic">Digital Forensic</option>
            <option value="OSINT">OSINT</option>
            <option value="Cryptography">Cryptography</option>
            <option value="Steganography">Steganography</option>
          </select>
          <select id="difficultyFilter" style="background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:10px 14px; border-radius:var(--radius-sm); font-family:var(--font-heading); font-size:13px; cursor:pointer;">
            <option value="">All Difficulties</option>
            <option value="EASY">Easy</option>
            <option value="MEDIUM">Medium</option>
            <option value="HARD">Hard</option>
            <option value="INSANE">Insane</option>
          </select>
        </div>

        <!-- Challenge Grid / Empty State -->
        <div id="challengeGrid" class="challenge-grid" style="margin-top: 16px; text-align: center; padding: 60px 0;">
          <p style="font-family: var(--font-heading); font-size: 15px; font-weight: 700; color: var(--accent);">
            Initializing tactical grid...
          </p>
        </div>
      </div>
    </div>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/websocket.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script src="/assets/js/components/challengeCard.js"></script>
  <script src="/assets/js/public/challenges.js"></script>
</body>
</html>
