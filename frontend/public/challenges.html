<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISSIONS // XPLOITX CYBER BATTLEFIELD</title>
  
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/public.css">
</head>
<body>
  
  <!-- Original Dynamic Header -->
  <div id="navbar-container"></div>

  <main class="container" style="padding: 40px 20px;">
    
    <!-- New Event Track Layout Inside Main (Native CSS) -->
    <div class="event-track-container">
      
      <!-- Event Track Graph -->
      <div style="width: 100%;">
        <h2 class="event-track-header">Event Track</h2>
        
        <div class="event-track-timeline">
          <!-- Connecting Line -->
          <div class="event-track-line"></div>
          
          <!-- Track Nodes -->
          <div class="track-node-wrapper" onclick="selectTrack(1, 'PWN')">
            <div class="track-node active completed" id="node-1">
              <div class="track-node-inner">
                <span class="track-node-icon">PWN</span>
              </div>
              <div class="track-badge-completed">✓</div>
              <div class="track-badge-active" id="active-dot-1"></div>
            </div>
            <div class="track-label">
              <p class="track-title">Track 1 (PWN)</p>
              <p class="track-status">COMPLETED</p>
            </div>
          </div>

          <div class="track-node-wrapper" onclick="selectTrack(2, 'WEB')">
            <div class="track-node" id="node-2">
              <div class="track-node-inner">
                <span class="track-node-icon">WEB</span>
              </div>
            </div>
            <div class="track-label">
              <p class="track-title">Track 2 (Web)</p>
            </div>
          </div>
          
          <div class="track-node-wrapper" onclick="selectTrack(3, 'REV')">
            <div class="track-node" id="node-3">
              <div class="track-node-inner">
                <span class="track-node-icon">REV</span>
              </div>
            </div>
            <div class="track-label">
              <p class="track-title">Track 3 (Reverse)</p>
            </div>
          </div>
        </div>
      </div>

      <div style="width: 100%; height: 1px; background: var(--border); margin: 8px 0;"></div>

      <!-- Selected Track Details Area -->
      <div style="display: flex; flex-direction: column; gap: 24px;">
        <!-- Banner -->
        <div class="track-details-banner">
          <div class="track-details-left">
            <h2 id="trackTitle">Track 1 (PWN)</h2>
            <p>Complete the available challenge path for this track.</p>
          </div>
          
          <div class="track-details-stats">
            <div class="track-stat-block">
              <span class="track-stat-label" style="color: var(--accent);">Challenges Solved</span>
              <span class="track-stat-value">0 / 0</span>
            </div>
            <div class="track-stat-divider"></div>
            <div class="track-stat-block">
              <span class="track-stat-label" style="color: var(--danger);">Track Ended</span>
              <span class="track-stat-value" style="color: var(--text-secondary);">00:00:00</span>
            </div>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="track-toolbar">
          <input 
            type="search" 
            id="challengeSearch"
            class="track-search-input" 
            placeholder="Search challenges by name or category..."
          >
        </div>

        <!-- Challenge Grid / Empty State -->
        <div id="challengeGrid" class="challenge-grid" style="margin-top: 16px; text-align: center; padding: 60px 0;">
          <p style="font-family: var(--font-heading); font-size: 15px; font-weight: 700; color: var(--accent);">
            Challenges are being prepared
          </p>
        </div>
      </div>
    </div>
  </main>

  <script>
    function selectTrack(id, title) {
      // Reset all nodes
      for(let i=1; i<=3; i++) {
        const node = document.getElementById('node-' + i);
        if(node) {
          node.classList.remove('active');
          const dot = document.getElementById('active-dot-' + i);
          if(dot) dot.remove();
        }
      }
      
      // Activate clicked
      const activeNode = document.getElementById('node-' + id);
      if(activeNode) {
        activeNode.classList.add('active');
        const dot = document.createElement('div');
        dot.className = 'track-badge-active';
        dot.id = 'active-dot-' + id;
        activeNode.appendChild(dot);
      }
      
      // Update title
      document.getElementById('trackTitle').innerText = 'Track ' + id + ' (' + title + ')';
    }
  </script>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/websocket.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script src="/assets/js/components/challengeCard.js"></script>
  <script src="/assets/js/public/challenges.js"></script>
</body>
</html>
