<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTEL DISPATCHES // XPLOITX CYBER BATTLEFIELD</title>
  <meta name="description" content="Live intelligence broadcasts, mission updates, and tactical advisories from C2 Command.">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/public.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container" style="padding: 40px 20px; max-width: 860px;">
    <header style="margin-bottom: 36px; border-bottom:1px solid var(--border); padding-bottom:20px;">
      <span style="font-family:var(--font-mono); font-size:12px; color:var(--accent); font-weight:700; letter-spacing:0.1em;">
        COMMUNICATION FREQUENCY // C2 DISPATCH
      </span>
      <h1 style="font-family:var(--font-heading); font-size:32px; font-weight:800; color:#fff; margin:6px 0 8px 0;">
        Intel Dispatches & Broadcasts
      </h1>
      <p style="color:var(--text-secondary); font-size:14px; margin:0;">
        Live mission intelligence broadcasts streamed directly from battlefield command.
      </p>
    </header>

    <div id="announcementsList" style="display:flex; flex-direction:column; gap:20px;">
      <div style="text-align:center; padding:40px; color:var(--text-secondary); font-family:var(--font-mono);">
        SCANNING FREQUENCIES...
      </div>
    </div>
  </main>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/websocket.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Navbar.render('navbar-container', 'announcements');

      const container = document.getElementById('announcementsList');

      async function loadAnnouncements() {
        try {
          const res = await window.api.getAnnouncements();
          if (res && res.announcements && res.announcements.length > 0) {
            container.innerHTML = res.announcements.map(ann => {
              const esc = window.Utils.escapeHTML;
              const timeAgo = window.Utils.timeAgo(ann.created_at);
              return `
                <article style="background:var(--bg-card); border:1px solid var(--border); border-left:4px solid ${ann.urgent ? 'var(--danger)' : 'var(--cyan)'}; padding:24px; border-radius:var(--radius-sm);">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <span style="font-family:var(--font-mono); font-size:11px; font-weight:700; color:${ann.urgent ? 'var(--danger)' : 'var(--cyan)'}; letter-spacing:0.08em;">
                      ${ann.urgent ? '🚨 CRITICAL DIRECTIVE' : '📡 TACTICAL NOTICE'}
                    </span>
                    <span style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted);">
                      ${timeAgo}
                    </span>
                  </div>
                  <h2 style="font-family:var(--font-heading); font-size:18px; font-weight:700; color:#fff; margin:0 0 10px 0;">
                    ${esc(ann.title)}
                  </h2>
                  <div style="color:var(--text-primary); font-size:13px; line-height:1.7; white-space:pre-line;">
                    ${esc(ann.content)}
                  </div>
                </article>
              `;
            }).join('');
          } else {
            container.innerHTML = `
              <div style="text-align:center; padding:40px; color:var(--text-secondary); font-family:var(--font-mono);">
                NO ACTIVE BROADCASTS. COMM CHANNEL QUIET.
              </div>
            `;
          }
        } catch (err) {
          container.innerHTML = `<div style="color:var(--danger); font-family:var(--font-mono);">Failed to fetch broadcasts.</div>`;
        }
      }

      loadAnnouncements();

      // Listen to live WebSocket broadcasts
      if (window.tacticalSocket) {
        window.tacticalSocket.on('ANNOUNCEMENT', () => {
          loadAnnouncements();
        });
      }
    });
  </script>
</body>
</html>
