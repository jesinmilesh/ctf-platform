<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENLIST // XPLOITX CYBER BATTLEFIELD</title>
  <meta name="description" content="Operative registration for the XPLOITX Cyber Battlefield CTF.">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/public.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container" style="display:flex; justify-content:center; align-items:center; min-height: calc(100vh - 160px); padding:40px 20px;">
    <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); max-width:480px; width:100%; padding:36px; box-shadow:0 12px 32px rgba(0,0,0,0.6);">

      <div style="text-align:center; margin-bottom:28px;">
        <span style="font-family:var(--font-mono); font-size:12px; color:var(--cyan); font-weight:700; letter-spacing:0.12em;">
          NEW RECRUIT REGISTRY
        </span>
        <h1 style="font-family:var(--font-heading); font-size:26px; font-weight:800; color:#fff; margin:6px 0 8px 0;">
          Enlist in Battlefield
        </h1>
        <p style="font-size:13px; color:var(--text-secondary); margin:0;">
          Commission your digital identity for active missions.
        </p>
      </div>

      <div id="registerError" style="display:none; background:var(--danger-muted); border:1px solid var(--danger); color:var(--danger); padding:12px; border-radius:var(--radius-sm); font-size:12px; font-family:var(--font-mono); margin-bottom:20px;">
      </div>

      <form id="registerForm" style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label for="regUsername" style="display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); margin-bottom:6px;">
            OPERATIVE USERNAME *
          </label>
          <input
            type="text"
            id="regUsername"
            required
            placeholder="e.g. ghost_in_shell"
            style="width:100%; background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:12px 14px; border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:13px;"
          >
        </div>

        <div>
          <label for="regEmail" style="display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); margin-bottom:6px;">
            COMMUNICATION FREQUENCY (EMAIL) *
          </label>
          <input
            type="email"
            id="regEmail"
            required
            placeholder="operative@cyberfield.net"
            style="width:100%; background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:12px 14px; border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:13px;"
          >
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
          <div>
            <label for="regCallsign" style="display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); margin-bottom:6px;">
              CALLSIGN
            </label>
            <input
              type="text"
              id="regCallsign"
              placeholder="e.g. CIPHER_01"
              style="width:100%; background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:12px 14px; border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:13px;"
            >
          </div>
          <div>
            <label for="regAffiliation" style="display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); margin-bottom:6px;">
              AFFILIATION / ACADEMY
            </label>
            <input
              type="text"
              id="regAffiliation"
              placeholder="e.g. MIT, CERT, Solo"
              style="width:100%; background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:12px 14px; border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:13px;"
            >
          </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
          <div>
            <label for="regPassword" style="display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); margin-bottom:6px;">
              PASSPHRASE *
            </label>
            <input
              type="password"
              id="regPassword"
              required
              placeholder="••••••••••••"
              style="width:100%; background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:12px 14px; border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:13px;"
            >
          </div>
          <div>
            <label for="regConfirm" style="display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); margin-bottom:6px;">
              CONFIRM PASSPHRASE *
            </label>
            <input
              type="password"
              id="regConfirm"
              required
              placeholder="••••••••••••"
              style="width:100%; background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:12px 14px; border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:13px;"
            >
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="padding:14px; font-size:13px; margin-top:8px;">
          CONFIRM ENLISTMENT
        </button>

        <div style="text-align:center; margin-top:10px; font-size:12px; color:var(--text-secondary);">
          Already enlisted? <a href="/login.html" style="color:var(--accent); text-decoration:none; font-weight:600;">Sign In</a>
        </div>
      </form>
    </div>
  </main>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/websocket.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script src="/assets/js/public/register.js"></script>
</body>
</html>
