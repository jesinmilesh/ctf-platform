<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISSIONS // XPLOITX CYBER BATTLEFIELD</title>
  <meta name="description" content="Browse active operations, exploit vulnerabilities, and capture cryptographic flags.">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/public.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container" style="padding: 40px 20px;">
    <section class="missions">
      <header class="page-header" style="margin-bottom: 28px;">
        <span class="eyebrow" style="font-family:var(--font-mono); font-size:12px; color:var(--accent); font-weight:700; letter-spacing:0.12em;">
          BATTLEFIELD // MISSIONS
        </span>
        <h1 style="font-family:var(--font-heading); font-size:32px; font-weight:800; color:#fff; margin:6px 0 8px 0;">
          Active Operations
        </h1>
        <p style="color:var(--text-secondary); font-size:14px; margin:0;">
          Identify your target. Breach the system. Capture the flag.
        </p>
      </header>

      <!-- Mission Filters (Section 10) -->
      <div class="mission-filters" style="display:flex; gap:12px; flex-wrap:wrap; background:var(--bg-card); border:1px solid var(--border); padding:16px; border-radius:var(--radius-sm); margin-bottom:28px;">
        <input
          type="search"
          id="challengeSearch"
          placeholder="Search missions, CVE vectors, or categories..."
          style="flex:1; min-width:220px; background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:10px 14px; border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:13px;"
        >

        <select id="categoryFilter" style="background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:10px 14px; border-radius:var(--radius-sm); font-family:var(--font-heading); font-size:13px;">
          <option value="">All Categories</option>
        </select>

        <select id="difficultyFilter" style="background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:10px 14px; border-radius:var(--radius-sm); font-family:var(--font-heading); font-size:13px;">
          <option value="">All Difficulties</option>
          <option value="EASY">Easy</option>
          <option value="MEDIUM">Medium</option>
          <option value="HARD">Hard</option>
          <option value="INSANE">Insane</option>
        </select>
      </div>

      <!-- Challenge Grid -->
      <div id="challengeGrid" class="challenge-grid">
        <div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-secondary); font-family:var(--font-mono);">
          TRANSMITTING MISSION DOSSIERS...
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/websocket.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script src="/assets/js/components/challengeCard.js"></script>
  <script src="/assets/js/public/challenges.js"></script>
</body>
</html>
