<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COMMAND CENTER // XPLOITX CYBER BATTLEFIELD</title>
  <meta name="description" content="Operative Command Center HUD - active telemetry, squad stats, and mission briefing.">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/public.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container" style="padding: 36px 20px;">
    <!-- Tactical HUD Header -->
    <header style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:24px 28px; margin-bottom:28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
      <div>
        <div style="display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11px; color:var(--accent); font-weight:700; margin-bottom:4px;">
          <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);"></span>
          XPLOITX // COMMAND CENTER
        </div>
        <h1 style="font-family:var(--font-heading); font-size:28px; font-weight:800; color:#fff; margin:0;">
          OPERATIVE: <span id="hudCallsign" style="color:var(--accent);">INITIALIZING...</span>
        </h1>
        <div style="font-family:var(--font-mono); font-size:12px; color:var(--text-secondary); margin-top:4px;">
          AFFILIATION: <span id="hudAffiliation">--</span> • SQUAD: <span id="hudSquad" style="color:#fff; font-weight:700;">--</span>
        </div>
      </div>

      <div style="display:flex; gap:10px;">
        <a href="/challenges.html" class="btn btn-primary" style="text-decoration:none;">
          EXPLORE MISSIONS
        </a>
        <a href="/team.html" class="btn btn-outline" style="text-decoration:none;">
          MANAGE SQUAD
        </a>
      </div>
    </header>

    <!-- Metrics Telemetry Cards -->
    <section class="hero-telemetry-grid" id="hudMetricsSlot" style="margin-top:0; margin-bottom:36px;">
      <!-- Populated via dashboard.js -->
    </section>

    <!-- Priority Operations -->
    <section style="margin-bottom: 40px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:12px;">
        <div>
          <span style="font-family:var(--font-mono); font-size:11px; color:var(--accent); font-weight:700;">TARGET SECTORS</span>
          <h2 style="font-family:var(--font-heading); font-size:20px; font-weight:700; color:#fff; margin:2px 0 0 0;">
            Immediate Action Missions
          </h2>
        </div>
        <a href="/challenges.html" class="btn btn-sm btn-outline" style="text-decoration:none;">ALL MISSIONS →</a>
      </div>

      <div class="challenge-grid" id="hudMissionsSlot">
        <div style="grid-column: 1 / -1; text-align:center; padding:30px; color:var(--text-secondary); font-family:var(--font-mono);">
          RETRIEVING TARGET VECTORS...
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/websocket.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/navbar.js"></script>
  <script src="/assets/js/components/scoreCard.js"></script>
  <script src="/assets/js/components/challengeCard.js"></script>
  <script src="/assets/js/public/dashboard.js"></script>
</body>
</html>
