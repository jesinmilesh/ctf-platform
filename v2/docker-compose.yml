version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ctf_postgres
    environment:
      POSTGRES_USER: xploitx_user
      POSTGRES_PASSWORD: xploitx_password
      POSTGRES_DB: xploitx_ctf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xploitx_user -d xploitx_ctf"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ctf_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
