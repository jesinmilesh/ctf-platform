<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANALYTICS // XPLOITX C2</title>
  <meta name="description" content="Battlefield telemetry, solve rates, and category statistics.">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>

  <header class="tactical-navbar admin-header">
    <div class="container navbar-inner">
      <span style="font-family:var(--font-display); font-size:16px; font-weight:900; color:#fff;">
        XPLOITX // <span style="color:var(--danger);">C2 COMMAND ROOM</span>
      </span>
      <a href="/dashboard.html" class="btn btn-sm btn-outline" style="text-decoration:none;">PUBLIC PORTAL</a>
    </div>
  </header>

  <div class="container" style="padding: 24px 20px;">
    <div class="admin-layout-body">
      <div id="admin-sidebar-container"></div>

      <main>
        <div style="margin-bottom:24px;">
          <span style="font-family:var(--font-mono); font-size:11px; color:var(--accent); font-weight:700; letter-spacing:0.1em;">
            TELEMETRY // PERFORMANCE
          </span>
          <h1 style="font-family:var(--font-heading); font-size:26px; font-weight:800; color:#fff; margin:2px 0 0 0;">
            Platform Analytics
          </h1>
        </div>

        <!-- Metrics -->
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:28px;">
          <div class="telemetry-card" style="border-left: 3px solid var(--accent);">
            <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-secondary);">ACCURACY RATE</div>
            <div class="telemetry-val" id="statSolveRate" style="color:var(--accent);">--%</div>
          </div>
          <div class="telemetry-card" style="border-left: 3px solid var(--cyan);">
            <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-secondary);">CONFIRMED SOLVES</div>
            <div class="telemetry-val" id="statTotalSolves">--</div>
          </div>
          <div class="telemetry-card" style="border-left: 3px solid var(--purple);">
            <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-secondary);">TOTAL SUBMISSIONS</div>
            <div class="telemetry-val" id="statTotalSubs">--</div>
          </div>
        </div>

        <!-- Category Breakdown -->
        <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:24px;">
          <h2 style="font-family:var(--font-heading); font-size:18px; font-weight:700; color:#fff; margin:0 0 16px 0;">
            Category Solve Distribution
          </h2>
          <div id="analyticsCategoryBreakdown">
            <div style="color:var(--text-secondary); font-family:var(--font-mono);">Analyzing solve patterns...</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/sidebar.js"></script>
  <script src="/assets/js/admin/analytics.js"></script>
</body>
</html>
