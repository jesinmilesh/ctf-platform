<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BROADCAST DISPATCHER // XPLOITX C2</title>
  <meta name="description" content="Dispatch live tactical announcements and priority advisories to operatives.">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/reset.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>

  <header class="tactical-navbar admin-header">
    <div class="container navbar-inner">
      <span style="font-family:var(--font-display); font-size:16px; font-weight:900; color:#fff;">
        XPLOITX // <span style="color:var(--danger);">C2 COMMAND ROOM</span>
      </span>
      <a href="/dashboard.html" class="btn btn-sm btn-outline" style="text-decoration:none;">PUBLIC PORTAL</a>
    </div>
  </header>

  <div class="container" style="padding: 24px 20px;">
    <div class="admin-layout-body">
      <div id="admin-sidebar-container"></div>

      <main>
        <div style="margin-bottom:24px;">
          <span style="font-family:var(--font-mono); font-size:11px; color:var(--accent); font-weight:700; letter-spacing:0.1em;">
            TELEMETRY BROADCAST // C2 DISPATCH
          </span>
          <h1 style="font-family:var(--font-heading); font-size:26px; font-weight:800; color:#fff; margin:2px 0 0 0;">
            Intel & Announcement Dispatcher
          </h1>
        </div>

        <div style="display:grid; grid-template-columns: 1.1fr 1fr; gap:24px;">
          <!-- Dispatch Form -->
          <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:24px;">
            <h2 style="font-family:var(--font-heading); font-size:18px; font-weight:700; color:#fff; margin:0 0 16px 0;">
              Transmit New Advisory
            </h2>

            <form id="dispatchAnnouncementForm" style="display:flex; flex-direction:column; gap:16px;">
              <div>
                <label for="annTitle" style="display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); margin-bottom:6px;">
                  BROADCAST HEADLINE *
                </label>
                <input
                  type="text"
                  id="annTitle"
                  required
                  placeholder="e.g. MISSION SECTOR 3 UNLOCKED"
                  style="width:100%; background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:12px 14px; border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:13px;"
                >
              </div>

              <div>
                <label for="annContent" style="display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-secondary); margin-bottom:6px;">
                  INTEL CONTENT *
                </label>
                <textarea
                  id="annContent"
                  rows="5"
                  required
                  placeholder="Details regarding competition schedule, challenge clarifications, or urgent hints..."
                  style="width:100%; background:var(--bg-secondary); border:1px solid var(--border); color:#fff; padding:12px 14px; border-radius:var(--radius-sm); font-family:var(--font-mono); font-size:13px;"
                ></textarea>
              </div>

              <div style="display:flex; align-items:center; gap:10px;">
                <input type="checkbox" id="annUrgent" style="width:16px; height:16px;">
                <label for="annUrgent" style="font-family:var(--font-heading); font-size:13px; font-weight:700; color:var(--danger); cursor:pointer;">
                  CRITICAL URGENT (DISPATCHES FULL-SCREEN BANNER)
                </label>
              </div>

              <button type="submit" class="btn btn-primary" style="padding:12px; margin-top:8px;">
                DISPATCH TO ALL OPERATIVES
              </button>
            </form>
          </div>

          <!-- History -->
          <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:24px;">
            <h2 style="font-family:var(--font-heading); font-size:18px; font-weight:700; color:#fff; margin:0 0 16px 0;">
              Broadcast Log History
            </h2>
            <div id="adminAnnouncementsHistory">
              <div style="color:var(--text-secondary); font-family:var(--font-mono); font-size:12px;">Reading broadcast history...</div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/storage.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components/toast.js"></script>
  <script src="/assets/js/components/sidebar.js"></script>
  <script src="/assets/js/admin/announcements.js"></script>
</body>
</html>
