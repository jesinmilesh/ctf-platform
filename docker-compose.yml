version: '3.8'

services:
  # 1. Authoritative Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: xploitx-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xploitx_db}
      POSTGRES_USER: ${POSTGRES_USER:-xploitx_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tactical_secret_db_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/initial_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xploitx_admin} -d ${POSTGRES_DB:-xploitx_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xploitx-internal

  # 2. Real-Time Pub/Sub & Caching Engine
  redis:
    image: redis:7-alpine
    container_name: xploitx-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - xploitx-internal

  # 3. Core API, Realtime Grid & Challenge Orchestrator
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xploitx-backend
    restart: always
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-xploitx_tactical_cyber_secret_key_2026}
      FLAG_PREFIX: ${FLAG_PREFIX:-XploitXβ{}
      FLAG_SUFFIX: ${FLAG_SUFFIX:-}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-xploitx_admin}:${POSTGRES_PASSWORD:-tactical_secret_db_pass_2026}@postgres:5432/${POSTGRES_DB:-xploitx_db}
      DB_TYPE: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_HOST: ${SERVER_HOST:-xploitxctf.me}
      INSTANCE_PORT_MIN: 41000
      INSTANCE_PORT_MAX: 41999
    ports:
      - "4000:4000"
      # Expose the dynamic multi-port range for on-demand challenge sandboxes
      - "41000-41999:41000-41999"
    volumes:
      # Mount Docker socket so backend can spin up / tear down challenge containers
      - /var/run/docker.sock:/var/run/docker.sock
      - ./challenge-storage:/app/challenge-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xploitx-internal

  # 4. High-Performance Reverse Proxy & Subdomain Router
  nginx:
    image: nginx:alpine
    container_name: xploitx-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - xploitx-internal

networks:
  xploitx-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
