name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Verification Tests
        run: npm test

  deploy:
    name: Production Deployment
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy Status
        run: |
          echo "========================================="
          echo "CI Pipeline Passed Successfully!"
          echo "Ready to trigger CD deployment webhooks."
          echo "========================================="
          # In a real environment, you would add your deployment steps here
          # e.g., SSH into server, pull latest code, run docker-compose up
